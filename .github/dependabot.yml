  - /poll/client
  - /presence-dashboard/client
  - /recovery-lab/client
  - /shared-poll-votes/client
  - /simple-chat-2/client
  - /simple-chat/client
  - /smoothie/client
  - /snake/client
  - /tennis-delta/client
  - /whiteboard/client
  schedule:
    interval: weekly
    day: monday
    time: "09:00"
    timezone: Europe/Zurich
  open-pull-requests-limit: 5
  groups:
